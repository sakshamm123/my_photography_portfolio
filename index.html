<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Saksham Mishra's photography portfolio, resume, and contact information.">
    <title>Saksham Mishra | Welcome</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0d0c;
            --ink: #f5f1ea;
            --ink-soft: rgba(245,241,234,0.72);
            --muted: rgba(245,241,234,0.55);
            --accent: #d9a267;
            --line: rgba(255,255,255,0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            background:
                radial-gradient(ellipse at 14% 20%, rgba(112,58,150,0.24), transparent 34%),
                radial-gradient(ellipse at 82% 25%, rgba(217,162,103,0.19), transparent 30%),
                radial-gradient(ellipse at 75% 88%, rgba(39,92,103,0.2), transparent 34%),
                linear-gradient(145deg, #090908 0%, #11100f 52%, #08090c 100%);
            color: var(--ink);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        a {
            color: inherit;
        }

        .landing {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: min(1120px, 89%);
            min-height: 100vh;
            min-height: 100svh;
            margin: 0 auto;
            padding: 28px 0 24px;
        }

        .wordmark {
            color: var(--ink-soft);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            text-decoration: none;
            text-transform: uppercase;
        }

        .intro {
            max-width: 760px;
            margin: auto 0;
            padding: 70px 0;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: var(--accent);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.22rem;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3.2rem, 9vw, 7.5rem);
            letter-spacing: -0.075em;
            line-height: 0.95;
        }

        .intro-copy {
            max-width: 580px;
            margin: 22px 0 0;
            color: var(--ink-soft);
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            line-height: 1.7;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-top: 40px;
        }

        .action {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(18,16,14,0.58);
            text-decoration: none;
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .action:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            background: rgba(217,162,103,0.12);
        }

        .action:focus-visible,
        .wordmark:focus-visible,
        .email:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .action-label {
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.16rem;
            text-transform: uppercase;
        }

        .action-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .action-title {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            font-weight: 650;
        }

        .action-arrow {
            color: var(--accent);
            font-size: 1.5rem;
            transition: transform 0.2s ease;
        }

        .action:hover .action-arrow {
            transform: translateX(4px);
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px 24px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .email {
            color: var(--ink-soft);
            text-decoration-color: var(--accent);
            text-underline-offset: 4px;
        }

        @media (max-width: 680px) {
            .landing {
                width: min(100% - 36px, 520px);
                padding: 22px 0;
            }

            .intro {
                padding: 56px 0;
            }

            .actions {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-top: 30px;
            }

            .action {
                min-height: 112px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="landing">
        <a class="wordmark" href="index.html">Saksham Mishra</a>

        <section class="intro" aria-labelledby="welcome-heading">
            <p class="eyebrow">Software developer · Photographer</p>
            <h1 id="welcome-heading">Welcome.</h1>
            <p class="intro-copy">Explore my work, learn about my experience, or get in touch.</p>

            <nav class="actions" aria-label="Explore my website">
                <a class="action" href="portfolio.html">
                    <span class="action-label">01 / Photography</span>
                    <span class="action-bottom">
                        <span class="action-title">My Photography Clicks</span>
                        <span class="action-arrow" aria-hidden="true">→</span>
                    </span>
                </a>
                <a class="action" href="resume.html">
                    <span class="action-label">02 / Experience</span>
                    <span class="action-bottom">
                        <span class="action-title">My Resume</span>
                        <span class="action-arrow" aria-hidden="true">→</span>
                    </span>
                </a>
                <a class="action" href="portfolio.html#contact">
                    <span class="action-label">03 / Say hello</span>
                    <span class="action-bottom">
                        <span class="action-title">My Contact</span>
                        <span class="action-arrow" aria-hidden="true">→</span>
                    </span>
                </a>
            </nav>
        </section>

        <footer>
            <span>Based in Ontario, Canada</span>
            <a class="email" href="mailto:sakshammishra1920@gmail.com">sakshammishra1920@gmail.com</a>
        </footer>
    </main>
</body>
</html>
