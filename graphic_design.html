<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Graphic design and illustration work by Saksham Mishra.">
    <title>Graphic Design | Saksham Mishra</title>
    <style>
        :root {
            --bg: #0d0d0c;
            --ink: #f5f1ea;
            --ink-soft: rgba(245,241,234,0.72);
            --muted: rgba(245,241,234,0.55);
            --accent: #d9a267;
            --line: rgba(255,255,255,0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 82% 10%, rgba(217,162,103,0.16), transparent 30%),
                linear-gradient(145deg, #090908 0%, #11100f 52%, #08090c 100%);
            color: var(--ink);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        a {
            color: inherit;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 5.5vw;
            border-bottom: 1px solid var(--line);
            background: rgba(13,13,12,0.58);
        }

        .brand {
            color: var(--ink-soft);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.2rem;
            text-decoration: none;
            text-transform: uppercase;
        }

        .back-link {
            color: var(--ink-soft);
            font-size: 0.78rem;
            letter-spacing: 0.08rem;
            text-decoration-color: var(--accent);
            text-underline-offset: 5px;
        }

        main {
            width: min(1120px, 89%);
            margin: 0 auto;
            padding: clamp(56px, 10vw, 112px) 0 80px;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: var(--accent);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.22rem;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 8vw, 6.5rem);
            letter-spacing: -0.075em;
            line-height: 0.95;
        }

        .intro {
            max-width: 640px;
            margin: 20px 0 44px;
            color: var(--ink-soft);
            font-size: 1.08rem;
            line-height: 1.7;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
            gap: 20px;
        }

        .artwork {
            overflow: hidden;
            margin: 0;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255,255,255,0.04);
        }

        .artwork a {
            display: block;
        }

        .artwork img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.25s ease;
        }

        .artwork a:hover img,
        .artwork a:focus-visible img {
            transform: scale(1.015);
        }

        .artwork a:focus-visible,
        .brand:focus-visible,
        .back-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        figcaption {
            padding: 16px 18px;
            color: var(--ink-soft);
            font-size: 0.9rem;
        }

        footer {
            padding: 24px;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12rem;
            text-align: center;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 18px;
            }

            .brand {
                font-size: 0.65rem;
                letter-spacing: 0.12rem;
            }

            main {
                width: min(100% - 36px, 520px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">Saksham Mishra</a>
        <a class="back-link" href="portfolio.html">Back to Photography</a>
    </header>

    <main>
        <p class="eyebrow">Creative work</p>
        <h1>Graphic Design</h1>
        <p class="intro">A collection of graphic design and illustration work.</p>

        <section class="gallery" aria-label="Graphic design portfolio">
            <figure class="artwork">
                <a href="pics/Illustrations/Qubec-city.jpg">
                    <img src="pics/Illustrations/Qubec-city.jpg" alt="Quebec City travel poster design featuring the Chateau Frontenac">
                </a>
                <figcaption>Quebec City travel poster</figcaption>
            </figure>
        </section>
    </main>

    <footer>Saksham Mishra · Graphic Design</footer>
</body>
</html>
